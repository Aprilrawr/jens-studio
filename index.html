      if(p.assetId){ const a=await getCap('assets'); if(a){ try{ await a.delete(p.assetId); }catch(err){} } }
      S.carousels.forEach(c=>{ let ch=false; (c.slides||[]).forEach(s=>{ if((p.assetId&&s.photoId===p.assetId)||(p.data&&s.photoData===p.data)){ s.photoId=''; s.photoData=''; ch=true; } }); if(ch) Store.queueCarousel(c,0); });
      await Store.delPhoto(p.id); render(); toast('Photo deleted'); } return; }
  if(d.pick!==undefined){ applyPhoto((S.pickList||[])[+d.pick]); return; }
  if(d.dl){ closeDialog(); if(d.dl==='pptx') exportPptx(); else if(d.dl==='png-one') exportPNG([S.slideIdx]); else exportPNG(curCar().slides.map((_,k)=>k)); return; }
  if(d.fmt){ const car=curCar(); if(car && fmtOf(car)!==d.fmt){ car.format=d.fmt; Store.queueCarousel(car); render(); } return; }
  if(d.align){ setAlign(d.align); return; }
  if(d.layout||d.bg){ const car=curCar(); const s=car.slides[S.slideIdx];
    if(d.layout){ s.layout=d.layout; S.sel=null;
      if(d.layout==='compare'){ s.leftTitle=s.leftTitle||'Do this'; s.rightTitle=s.rightTitle||'Not this'; }
      if(d.layout==='tip' && !s.number) s.number='Tip 1';
      if(d.layout==='split' && (s.bg||'sand')==='photo') s.bg='white';
      if(d.layout==='cta'){ const old=(s.heading||'').trim(); if(old!==JEN_TIPS){ if(old && old!=='Your headline here' && !s.accent) s.accent=old; s.heading=JEN_TIPS; } s.pos={}; s.align={}; } }
    if(d.bg) s.bg=d.bg;
    Store.queueCarousel(car); render();
    if(((d.bg==='photo' && s.layout!=='split') || (d.layout==='split')) && !imgSrc(s.photoId,s.photoData)) photoPicker();
    return; }
  if(d.rmFont!==undefined){ S.brand.fontFiles.splice(+d.rmFont,1); applyBrand(); Store.queueBrand(); render(); return; }
  const car=curCar();
  switch(d.act){
    case 'new-car': newDesign({kind:'carousel'}); break;
    case 'new-single': newDesign({kind:'single'}); break;
    case 'to-carousel': car.kind='carousel'; car.slides.push({id:uid('s'),layout:'cta',bg:'white',heading:JEN_TIPS,accent:'Questions? Let’s talk.',body:'Send me a message any time.',button:'Send me a DM',items:[]}); Store.queueCarousel(car); render(); toast('Now a carousel. It’s in the Carousels section.'); break;
    case 'add-idea': ideaDialog(null); break;
    case 'brainstorm': brainstorm(); break;
    case 'download': downloadDialog(); break;
    case 'pick-photo': photoPicker(); break;
    case 'pick-icon': iconPicker(); break;
    case 'rm-icon': { const s=curSlide(); if(s){ delete s.icon; delete s.iconStyle; if(s.pos) delete s.pos.icon; Store.queueCarousel(car); closeDialog(); render(); } break; }
    case 'center-all': centerAll(); break;
    case 'reset-layout': { const s=curSlide(); s.pos={}; s.align={}; Store.queueCarousel(car); refreshPreview(); toast('Layout reset'); break; }
    case 'deselect': S.sel=null; markSel(); break;
    case 'count-minus': setCount(car.slides.length-1); break;
    case 'count-plus': setCount(car.slides.length+1); break;
    case 'prev': S.slideIdx=Math.max(0,S.slideIdx-1); S.sel=null; render(); break;
    case 'next': S.slideIdx=Math.min(car.slides.length-1,S.slideIdx+1); S.sel=null; render(); break;
    case 'add-slide': car.slides.splice(S.slideIdx+1,0,{id:uid('s'),layout:'statement',bg:'sand',heading:'New slide',body:'',items:[]}); S.slideIdx++; S.sel=null; Store.queueCarousel(car); render(); break;
    case 'dup-slide': dupSlide(S.slideIdx); break;
    case 'up-slide': if(S.slideIdx>0){ const k=S.slideIdx; [car.slides[k-1],car.slides[k]]=[car.slides[k],car.slides[k-1]]; S.slideIdx--; Store.queueCarousel(car); render(); } break;
    case 'down-slide': if(S.slideIdx<car.slides.length-1){ const k=S.slideIdx; [car.slides[k+1],car.slides[k]]=[car.slides[k],car.slides[k+1]]; S.slideIdx++; Store.queueCarousel(car); render(); } break;
    case 'del-slide': removeSlide(S.slideIdx); break;
    case 'unpost': unpost(car); break;
    case 'rm-photo': { const s=curSlide(); s.photoId=''; s.photoData=''; Store.queueCarousel(car); render(); break; }
    case 'del-car': if(await askConfirm(`Delete “${car.title||'Untitled'}” for good?`)){ const kind=car.kind, wasPosted=!!car.posted; await Store.delCarousel(car.id); go(wasPosted?'used':kind==='single'?'singles':'carousels'); toast('Deleted'); } break;
    case 'backup': exportBackup(); break;
    case 'photo-center': { const s=curSlide(); delete s.photoX; delete s.photoY; Store.queueCarousel(car); render(); break; }
    case 'colors-all': { const s=curSlide(); car.slides.forEach(x=>{ if(x.bg!=='photo') return; if(s.hiColor) x.hiColor=s.hiColor; else delete x.hiColor; }); Store.queueCarousel(car); render(); toast('Applied to every photo slide'); break; }
    case 'new-folder': newPhotoFolder(); break;
    case 'rename-folder': renamePhotoFolder(S.photoCat); break;
    case 'del-folder': deletePhotoFolder(S.photoCat); break;
    case 'rm-headshot': S.brand.headshotId=''; S.brand.headshotData=''; Store.queueBrand(); render(); break;
  }
});
document.addEventListener('input', e=>{
  const t=e.target, d=t.dataset;
  if(d.photoPos){ const car=curCar(); if(!car) return; const s=car.slides[S.slideIdx]; s[d.photoPos]=+t.value; Store.queueCarousel(car); refreshPreview(); return; }
  if(d.field!==undefined){ const car=curCar(); if(!car) return; const s=car.slides[S.slideIdx];
    s[d.field] = (d.field==='items'||d.field==='items2') ? t.value.split('\n') : t.value; Store.queueCarousel(car); refreshPreview(); return; }
  if(d.carTitle!==undefined){ const car=curCar(); car.title=t.value; Store.queueCarousel(car); return; }
  if(d.bs!==undefined){ S.bsTheme=t.value; return; }
  if(d.usedQ!==undefined){ S.usedQuery=t.value; const pos=t.selectionStart; render(); const n=$('#used-q'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(d.brand){ S.brand[d.brand]=t.value; if(d.brand==='tintStrength'){ const v=$('#tint-val'); if(v) v.textContent=t.value+'%'; } if(d.brand.endsWith('Font')) loadGoogleFontDebounced(t.value); $('#bm-name').textContent='Jen’s Studio'; Store.queueBrand(); refreshBrandPreview(); return; }
  if(d.color){ S.brand[d.color]=t.value; const tx=document.querySelector(`[data-color-text="${d.color}"]`); if(tx) tx.value=t.value; Store.queueBrand(); refreshBrandPreview(); return; }
  if(d.colorText){ let v=t.value.trim(); if(/^[0-9a-fA-F]{6}$/.test(v)) v='#'+v; if(/^#[0-9a-fA-F]{6}$/.test(v)){ S.brand[d.colorText]=v; const c=document.querySelector(`[data-color="${d.colorText}"]`); if(c) c.value=v; Store.queueBrand(); refreshBrandPreview(); } return; }
});
let gfTimer; function loadGoogleFontDebounced(v){ clearTimeout(gfTimer); gfTimer=setTimeout(()=>loadGoogleFont(v),700); }
document.addEventListener('change', async e=>{
  const t=e.target, d=t.dataset;
  if(d.count!==undefined){ setCount(parseInt(t.value,10)); return; }
  if(d.swatchCustom){ const car=curCar(), s=curSlide(); if(s){ s[d.swatchCustom]=t.value; Store.queueCarousel(car); render(); } return; }
  if(d.handle!==undefined){ const car=curCar(), s=curSlide(); if(s){ s.showHandle=t.checked; Store.queueCarousel(car); refreshPreview(); } return; }
  if(d.movePhoto){ const p=S.photos.find(x=>x.id===d.movePhoto); if(p && photoCats()[t.value]){ await Store.updatePhoto({...p,category:t.value}); render(); toast(`Moved to ${photoCats()[t.value]}`); } return; }
  if(d.photoUpload!==undefined && t.files.length){ await uploadPhotos([...t.files], S.photoCat); t.value=''; if(S.view==='photos') render(); updateCounts(); return; }
  if(d.pickUpload!==undefined && t.files.length){ const added=await uploadPhotos([...t.files], S.pickCat==='all'?'interior':S.pickCat); if(added.length) applyPhoto(added[0]); return; }
  if(d.headshot!==undefined && t.files[0]){ try{ const r=await storeImage(t.files[0]); S.brand.headshotId=r.id; S.brand.headshotData=r.data; Store.queueBrand(); render(); toast('Headshot added'); }catch(err){ toast('That image couldn’t be read. Try a JPG or PNG.'); } return; }
  if(d.restoreFile!==undefined && t.files[0]){ await importBackup(t.files[0]); t.value=''; return; }
  if(d.fontfile!==undefined && t.files[0]){
    const famName=($('#font-fam').value||'').trim() || t.files[0].name.replace(/\.[^.]+$/,'');
    const assets=await getCap('assets'); const entry={family:famName,assetId:'',data:''};
    try{ if(assets){ const a=await assets.upload(t.files[0]); entry.assetId=a.id; } else { entry.data=await blobToData(t.files[0]); } }
    catch(err){ toast('That font file couldn’t be uploaded.'); return; }
    S.brand.fontFiles=[...(S.brand.fontFiles||[]).filter(f=>f.family!==famName),entry]; applyBrand(); Store.queueBrand(); render(); toast(`${famName} added. Use that name in a font box.`); return; }
});
document.addEventListener('focusout', e=>{ if(e.target.dataset && e.target.dataset.brand && e.target.dataset.brand.endsWith('Font')) loadGoogleFont(e.target.value); });
document.addEventListener('keydown', e=>{
  if(S.view!=='editor' || isTyping() || $('#dlg').open) return;
  const car=curCar(); if(!car) return;
  const arrows={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(S.sel && arrows[e.key]){
    e.preventDefault(); const s=curSlide(), step=e.shiftKey?50:10, [ax,ay]=arrows[e.key];
    s.pos=s.pos||{}; const p=s.pos[S.sel]||{x:0,y:0}; p.x=(p.x||0)+ax*step; p.y=(p.y||0)+ay*step; s.pos[S.sel]=p;
    Store.queueCarousel(car); refreshPreview(); return;
  }
  if(e.key==='Escape' && S.sel){ S.sel=null; markSel(); return; }
  if(e.key==='ArrowRight' && S.slideIdx<car.slides.length-1){ S.slideIdx++; render(); }
  if(e.key==='ArrowLeft' && S.slideIdx>0){ S.slideIdx--; render(); }
});
window.addEventListener('beforeunload',()=>{ Object.keys(Store.timers).forEach(k=>{ if(k.startsWith('car:')) Store.flushCarousel(k.slice(4)); }); Store.flushLocal(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ Object.keys(Store.timers).forEach(k=>{ if(k.startsWith('car:')){ clearTimeout(Store.timers[k]); Store.flushCarousel(k.slice(4)); } }); Store.flushLocal(); } });

/* =========================== start =========================== */
render(); applyBrand();
Store.init().then(()=>{ S.mode=Store.mode; applyBrand(); render(); setTimeout(compactLibrary, 4000); });
</script>
</body>
