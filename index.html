<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Studio</title>
<meta name="theme-color" content="#F6F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{
  --bg:#F6F2EC; --surface:#FFFFFF; --surface-2:#EFE8DF; --ink:#2F2924; --muted:#776A5F;
  --line:#E3D9CD; --accent:#8F755C; --accent-ink:#FFFFFF; --accent-soft:#E9DED1;
  --warn-bg:#F7E9D7; --warn-ink:#7A4E1C; --danger:#9C4434; --focus:#5E4A38; --sel:#2F6FDE;
  --ok-bg:#E1EFE2; --ok-ink:#2D6838; --ok-line:#B9D7BD; --del-bg:#F7E4DF; --del-line:#E6C1B8;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A17; --surface:#27231F; --surface-2:#312B26; --ink:#F2ECE4; --muted:#B4A799;
    --line:#3E3730; --accent:#CDB295; --accent-ink:#1D1A17; --accent-soft:#3A322A;
    --warn-bg:#3B2E1E; --warn-ink:#F0CF9F; --danger:#E5937F; --focus:#E8D3B8; --sel:#7FA8F0;
    --ok-bg:#1E3324; --ok-ink:#A6D9AF; --ok-line:#2F5238; --del-bg:#3A2420; --del-line:#5A332C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A17; --surface:#27231F; --surface-2:#312B26; --ink:#F2ECE4; --muted:#B4A799;
  --line:#3E3730; --accent:#CDB295; --accent-ink:#1D1A17; --accent-soft:#3A322A;
  --warn-bg:#3B2E1E; --warn-ink:#F0CF9F; --danger:#E5937F; --focus:#E8D3B8; --sel:#7FA8F0;
  --ok-bg:#1E3324; --ok-ink:#A6D9AF; --ok-line:#2F5238; --del-bg:#3A2420; --del-line:#5A332C;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{border-right:1px solid var(--line);padding:28px 16px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;height:100dvh}
.brandmark{padding:0 10px}
.brandmark .name{font-family:'Playfair Display',Georgia,serif;font-size:24px;line-height:1.1;font-weight:500}
.brandmark .sub{color:var(--muted);font-size:13px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
.nav .count{font-size:12px;color:var(--muted);min-width:22px;text-align:right}
.side .status{margin-top:auto;font-size:12px;color:var(--muted);padding:0 10px}
main{min-width:0;padding:32px clamp(16px,3.5vw,44px) 64px}
main:focus{outline:none}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.view-head h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0}
.view-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
.empty{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
.empty h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:var(--ink);margin:0 0 6px;font-size:22px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.badge.warn-b{background:var(--warn-bg);color:var(--warn-ink)}
.badge.ok{background:var(--accent-soft)}

/* ---------- design grid ---------- */
.car-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;align-items:start}
.car-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.car-card .open{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:block;width:100%}
.car-card .open:hover .t{text-decoration:underline}
.car-card .meta{padding:12px 14px 4px}
.car-card .t{font-weight:500;line-height:1.3}
.car-card .m{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.car-card .acts{display:flex;gap:4px;padding:6px 8px 10px;flex-wrap:wrap}
.car-card .acts-main{display:flex;gap:8px;justify-content:space-between;width:100%;padding:2px 0 4px}
.car-card .acts-more{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.btn.pill-ok{background:var(--ok-bg);color:var(--ok-ink);border:1px solid var(--ok-line);border-radius:999px;font-weight:500}
.btn.pill-ok:hover{filter:brightness(.97)}
.btn.pill-del{background:var(--del-bg);color:var(--danger);border:1px solid var(--del-line);border-radius:999px;font-weight:500}
.btn.pill-del:hover{filter:brightness(.97)}
.th-dup{position:absolute;top:32px;right:4px;z-index:3;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.th-dup svg{width:12px;height:12px}
.th-dup:hover{border-color:var(--ink)}

/* ---------- slide frames ---------- */
.frame{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#E9E1D6}
.frame.fmt-story{aspect-ratio:9/16}
.frame > .brand-scope{position:absolute;top:0;left:0;width:1080px;height:1350px;transform-origin:top left;transform:scale(var(--s,.2))}
.frame.fmt-story > .brand-scope{height:1920px}

/* ---------- editor ---------- */
.ed-top{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.ed-top .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-top .title-input{flex:1 1 240px;min-width:0;border:0;border-bottom:1px solid transparent;background:none;font-family:'Playfair Display',Georgia,serif;font-size:clamp(22px,3vw,30px);padding:4px 0}
.ed-top .title-input:hover,.ed-top .title-input:focus{border-bottom-color:var(--line);outline:none}
.ed-top .r2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-top .r2 .spacer{flex:1}
.stepper{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px;background:var(--surface);font-size:14px}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;font-size:18px;line-height:1}
.stepper input{width:44px;text-align:center;border:0;background:none;font-size:15px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed-body{display:grid;grid-template-columns:128px minmax(0,1fr) 340px;gap:22px;align-items:start}
.ed-body.single{grid-template-columns:minmax(0,1fr) 340px}
.thumbs{display:flex;flex-direction:column;gap:10px;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto;padding:3px}
.thumb{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);flex:0 0 auto}
.thumb[aria-current="true"]{box-shadow:0 0 0 3px var(--accent)}
.thumb-wrap{position:relative;flex:0 0 auto}
.thumb-wrap .thumb{display:block;width:100%}
.thumb-wrap.dragging{opacity:.5}
.thumb-wrap.dragging .thumb{box-shadow:0 0 0 3px var(--sel)}
.thumb-wrap .num{position:absolute;left:5px;top:5px;z-index:3;background:var(--surface);color:var(--ink);font-size:11px;line-height:1;padding:5px 7px;border-radius:7px;display:inline-flex;align-items:center;gap:3px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.thumb-wrap .num svg{width:9px;height:12px;fill:currentColor;opacity:.6}
.th-x{position:absolute;top:4px;right:4px;z-index:3;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.th-x:hover{color:var(--danger);border-color:var(--danger)}
.check-row{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.check-row input{width:20px;height:20px;accent-color:var(--accent)}
.toast-act{margin-left:12px;background:none;border:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px 2px}
.ph-draft{position:absolute;top:8px;left:8px;z-index:1;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:12px;line-height:1;padding:5px 9px;border-radius:999px}
.add-slide{border:1px dashed var(--line);background:none;border-radius:10px;padding:12px 6px;cursor:pointer;color:var(--muted);font-size:13px;flex:0 0 auto}
.add-slide:hover{border-color:var(--accent);color:var(--ink)}
.stage{display:flex;flex-direction:column;gap:12px;align-items:center;min-width:0}
.stage #stage-frame{width:100%;max-width:520px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage #stage-frame.fmt-story{max-width:340px}
.stage .frame{border-radius:14px;box-shadow:0 20px 50px rgba(47,41,36,.14)}
.stage-nav{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.tools{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.tools .tl{flex:1 1 100%;font-size:13px;color:var(--muted)}
.tools .tl b{color:var(--ink);font-weight:500}
.tgroup{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.tgroup button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.tgroup button+button{border-left:1px solid var(--line)}
.tgroup button:hover{background:var(--surface-2)}
.tgroup svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;max-width:560px;width:100%}
.fields{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;max-height:calc(100dvh - 32px);overflow:auto}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px}
.field textarea{resize:vertical;min-height:64px;line-height:1.45}
.field .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sw{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.slide-tools{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}

/* ---------- photos ---------- */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.ph-tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph-img{position:relative}
.ph-tile.is-used .ph-img{filter:grayscale(1)}
.ph-tile.is-used .ph-img::after,.picker button.is-used::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 2px),rgba(30,26,23,.9) calc(50% - 2px),rgba(30,26,23,.9) calc(50% + 2px),transparent calc(50% + 2px))}
.picker button.is-used{filter:grayscale(1)}
.ph-used{position:absolute;top:8px;left:8px;z-index:1;background:var(--ink);color:var(--bg);font-size:12px;line-height:1;padding:6px 10px;border-radius:999px}
.ph-move{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 10px;font-size:13px;max-width:100%}
.ph-sub{color:var(--muted);font-size:14px;margin:-8px 0 18px}
.pk-used{position:absolute;left:6px;top:6px;background:var(--ink);color:var(--bg);font-size:11px;line-height:1;padding:4px 7px;border-radius:999px}
@media (pointer:coarse){.ph-move{min-height:40px;font-size:16px}}
.ph-img{aspect-ratio:4/5;background:var(--surface-2) center/cover no-repeat}
.ph-acts{display:flex;gap:4px;padding:8px;flex-wrap:wrap;align-items:center}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;max-height:50vh;overflow:auto;margin:6px 0 14px}
.picker button{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;background:var(--surface-2) center/cover no-repeat;box-shadow:0 0 0 1px var(--line)}
.picker button:hover,.picker button:focus-visible{box-shadow:0 0 0 3px var(--accent)}

/* ---------- ideas ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.idea-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.idea h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:21px;line-height:1.25;margin:0}
.idea .hook{font-style:italic;color:var(--muted);margin:0}
.idea ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.sources{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.idea .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
.panel-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:24px}
.panel-box h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:20px;margin:0 0 4px}
.panel-box p{margin:0 0 14px;color:var(--muted);font-size:14px}
.suggest{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
.suggest .s{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.suggest .s b{font-weight:500}
.pill-input{flex:1 1 260px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px;min-width:0}

/* ---------- used ---------- */
.used-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.used-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.used-table th,.used-table td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.used-table th{font-weight:500;color:var(--muted);font-size:13px;background:var(--surface-2)}
.used-table tr:last-child td{border-bottom:0}

/* ---------- brand settings ---------- */
.brand-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.brand-form{display:flex;flex-direction:column;gap:22px}
.brand-form section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.brand-form h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:20px;margin:0}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.color{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.color input[type=color]{width:38px;height:38px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer}
.color .c-lbl{font-size:12px;color:var(--muted)}
.color input[type=text]{width:90px;border:0;background:none;font-size:14px;padding:0}
.brand-preview{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:sticky;top:16px}
.brand-preview .frame{border-radius:12px}
.headshot-row{display:flex;align-items:center;gap:14px}
.headshot-row .hs{width:64px;height:64px;border-radius:50%;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}

/* ---------- dialog / toast ---------- */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:24px;width:min(580px,calc(100vw - 32px));max-height:calc(100dvh - 40px)}
dialog::backdrop{background:rgba(29,26,23,.45)}
dialog h2{font-family:'Playfair Display',Georgia,serif;font-weight:500;margin:0 0 14px;font-size:24px}
dialog form{display:flex;flex-direction:column;gap:14px}
dialog .row.end{justify-content:flex-end;margin-top:6px}
.dl-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.dl-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;cursor:pointer}
.dl-opt:hover{border-color:var(--accent)}
.dl-opt b{font-weight:500;font-size:15px}
.dl-opt span{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:calc(100vw - 32px);text-align:center}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- touch (iPad) ---------- */
@media (pointer:coarse){
  .btn{min-height:44px;padding:10px 18px}
  .btn.small{min-height:40px;padding:8px 14px}
  .seg button,.tgroup button{min-height:42px;padding:8px 14px}
  .chips button{min-height:40px}
  .nav button{min-height:48px}

/* ---------- responsive ---------- */
@media (max-width:1279px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .ed-body,.ed-body.single{grid-template-columns:minmax(0,1fr) 320px}
  .ed-body .thumbs{grid-column:1 / -1;flex-direction:row;position:static;max-height:none;overflow-x:auto;overflow-y:hidden;padding:3px 3px 8px;-webkit-overflow-scrolling:touch}
  .ed-body .thumbs .thumb{width:84px}
  .ed-body .thumbs .thumb.story{width:58px}
  .ed-body .thumbs .add-slide{width:84px}
  .brand-grid{grid-template-columns:1fr}
  .brand-preview{position:static;max-width:520px}
}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 12px;gap:12px;border-right:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:10;overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .brandmark,.side .status{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;padding:8px 12px}
  .nav .count{display:none}
  .ed-body,.ed-body.single{grid-template-columns:1fr}
  .stage{order:1}
  .ed-body .thumbs{order:2}
  .fields{order:3;position:static;max-height:none}
  .idea-list{grid-template-columns:1fr}
}

/* =========================================================
   SLIDE DESIGN (1080 wide, rendered full size and scaled)
   ========================================================= */
.brand-scope{
  --b-bg:#EAE1D5; --b-card:#FFFFFF; --b-accent:#A68C72; --b-ink:#2E2823; --b-soft:#F5F0E9;
  --b-display:'Playfair Display',Georgia,serif; --b-body:'Jost',system-ui,sans-serif; --b-script:var(--b-display);
}
.slide{position:relative;width:1080px;height:1350px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--b-body);color:var(--b-ink);background:var(--b-bg)}
.slide.fmt-story{height:1920px}
.slide.bg-sand{background:var(--b-bg)}
.slide.bg-sage{background:var(--b-sage,#DDE7DC)}
.slide.bg-white{background:var(--b-card)}
.slide.bg-taupe{background:var(--b-accent);color:var(--b-card)}
.slide.bg-ink{background:var(--b-ink);color:var(--b-card)}
.slide.bg-photo{background:linear-gradient(160deg,var(--b-soft) 0%,var(--b-bg) 55%,var(--b-accent) 140%)}
.slide .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.slide .ph-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.12) 100%)}
.slide .panel{position:relative;z-index:1;width:100%;padding:130px 110px 170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.slide.fmt-story .panel{padding:300px 110px 400px}
.slide.bg-photo .panel,.slide.fmt-story.bg-photo .panel{width:auto;max-width:860px;margin:0 110px;padding:84px 76px 64px;background:var(--b-card);color:var(--b-ink);border-radius:44px;box-shadow:0 34px 90px rgba(30,24,18,.22);gap:28px}
.slide .h{font-family:var(--b-display);font-weight:500;line-height:1.04;letter-spacing:-.012em;margin:0;text-wrap:balance}
.slide.lay-cta .h{font-family:var(--b-tips);font-weight:400;letter-spacing:0;line-height:1.1}
.slide .acc{font-family:var(--b-script);font-style:italic;font-weight:400;line-height:1.15;margin:-6px 0 0;text-wrap:balance;opacity:.92}
.slide .acc.script{font-style:normal}
.slide .body{font-size:38px;line-height:1.45;font-weight:400;margin:0;max-width:800px;text-wrap:balance;opacity:.86}
.slide .rule{width:120px;height:2px;background:currentColor;opacity:.35;flex:0 0 auto}
.slide .pill{display:inline-block;padding:22px 52px;border-radius:60px;background:var(--b-accent);color:var(--b-card);font-size:33px;font-weight:500;letter-spacing:.02em}
.slide.bg-taupe .pill,.slide.bg-ink .pill{background:var(--b-card);color:var(--b-ink)}
.slide .items{display:flex;flex-direction:column;gap:20px;width:100%;max-width:820px}
.slide .item{background:var(--b-card);color:var(--b-ink);border-radius:60px;padding:26px 46px;font-size:40px;line-height:1.3;text-wrap:balance;box-shadow:0 8px 24px rgba(30,24,18,.06)}
.slide.bg-white .item,.slide.bg-photo .item{background:var(--b-soft);box-shadow:none}
.slide .steps{display:flex;flex-direction:column;gap:30px;width:100%;max-width:820px;margin:0;padding:0;list-style:none}
.slide .steps li{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:34px;line-height:1.3;text-wrap:balance}
.slide .steps .n{width:64px;height:64px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-family:var(--b-display);font-size:33px;opacity:.85}
.slide .big{font-family:var(--b-display);font-weight:500;line-height:.95;letter-spacing:-.02em;margin:0}
.slide .mf{display:flex;flex-direction:column;gap:24px;width:100%;max-width:820px}
.slide .mf .card{border-radius:36px;padding:38px 48px;display:flex;flex-direction:column;gap:12px;align-items:center}
.slide .mf .card.myth{background:transparent;border:2px solid currentColor;opacity:.75}
.slide .mf .card.fact{background:var(--b-card);color:var(--b-ink)}
.slide.bg-white .mf .card.fact,.slide.bg-photo .mf .card.fact{background:var(--b-soft)}
.slide .mf .lbl{font-family:var(--b-script);font-style:italic;font-size:48px}
.slide .mf .lbl.script{font-style:normal}
.slide .mf .txt{font-size:45px;line-height:1.35;text-wrap:balance}
.slide .headshot{width:280px;height:280px;border-radius:50%;background:var(--b-soft) center/cover no-repeat;border:10px solid var(--b-card);box-shadow:0 16px 40px rgba(30,24,18,.16);flex:0 0 auto}
.slide .sig{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:35px;line-height:1.4}
.slide .sig b{font-family:var(--b-display);font-weight:500;font-size:40px}
.slide .sig span{opacity:.8}
.slide .foot{position:absolute;left:0;right:0;bottom:58px;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:31px;letter-spacing:.06em;padding:0 120px}
.slide.fmt-story .foot{bottom:300px}
.slide .foot span{opacity:.72}
.slide .foot .fn{letter-spacing:0;font-size:30px;text-wrap:balance;opacity:.65}
.slide .foot-in{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:29px;letter-spacing:.05em;margin-top:6px}
.slide .foot-in span{opacity:.65}
.slide .foot-in .fn{letter-spacing:0;font-size:27px;text-wrap:balance}
.slide .qmark{font-family:var(--b-display);font-size:300px;line-height:1;height:170px;overflow:hidden;color:var(--b-accent);margin-bottom:-30px}
.slide.bg-taupe .qmark,.slide.bg-ink .qmark{color:var(--b-card)}
.slide .h.quote-text{font-style:italic;font-weight:400;line-height:1.15}
.slide .checks{display:flex;flex-direction:column;gap:26px;width:100%;max-width:840px;align-items:center}
.slide .check{display:flex;align-items:center;gap:24px;font-size:46px;line-height:1.3;text-align:left;text-wrap:balance}
.slide .check .ck{flex:0 0 auto;width:62px;height:62px;border-radius:50%;background:var(--b-accent);color:var(--b-card);display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1}
.slide.bg-taupe .check .ck,.slide.bg-ink .check .ck{background:var(--b-card);color:var(--b-ink)}
.slide .cmp{display:flex;gap:28px;width:100%;max-width:900px;align-items:stretch}
.slide .cmp-col{flex:1 1 0;min-width:0;border-radius:36px;padding:40px 30px;display:flex;flex-direction:column;gap:20px;align-items:center}
.slide .cmp-col.do{background:var(--b-card);color:var(--b-ink)}
.slide.bg-white .cmp-col.do,.slide.bg-photo .cmp-col.do{background:var(--b-soft)}
.slide .cmp-col.dont{border:3px solid currentColor}
.slide .cmp-t{font-family:var(--b-display);font-size:54px;line-height:1.1;display:flex;align-items:center;gap:14px;text-align:left}
.slide .cmp-t .ic{width:52px;height:52px;border-radius:50%;background:var(--b-accent);color:var(--b-card);font-family:var(--b-body);font-size:32px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;width:58px;height:58px}
.slide .cmp-col.dont .cmp-t .ic{background:transparent;border:3px solid currentColor;color:inherit}
.slide .cmp-i{font-size:46px;line-height:1.3;text-wrap:balance}
.slide.bg-photo.lay-compare .panel{width:calc(100% - 80px);max-width:1000px;margin:0 40px;padding:72px 44px 60px}
.slide.bg-photo.lay-compare .cmp{gap:22px}
.slide.bg-photo.lay-compare .cmp-col{padding:38px 24px}
.slide .tint{position:absolute;inset:0;background:var(--b-tint,#B7CFBA);opacity:var(--b-tint-o,.16);pointer-events:none}
.slide.lay-split .tint{top:54%}
.slide.bg-ink .tint,.slide.bg-taupe .tint{opacity:calc(var(--b-tint-o,.16) * .6)}
.slide .tag{display:inline-block;border:3px solid currentColor;border-radius:60px;padding:14px 38px;font-size:35px;letter-spacing:.06em}
.slide.lay-split{flex-direction:column;justify-content:flex-start}
.slide .split-ph{width:100%;height:54%;flex:0 0 auto;background:var(--b-soft) center/cover no-repeat}
.slide.lay-split .panel{flex:1 1 auto;padding:60px 100px 130px;gap:24px}
.slide.fmt-story.lay-split .panel{padding:70px 100px 380px}
.slide .al-left{align-self:flex-start;text-align:left;align-items:flex-start}
.slide .al-right{align-self:flex-end;text-align:right;align-items:flex-end}
.slide .al-center{align-self:center;text-align:center;align-items:center}
.slide .foot.al-left,.slide .foot.al-right{align-self:auto}
.live [data-el]{cursor:grab;touch-action:none}
.live [data-el]:active{cursor:grabbing}
.live .is-sel{outline:8px dashed var(--sel-slide,#2F6FDE);outline-offset:16px}
@media (hover:hover){.live [data-el]:not(.is-sel):hover{outline:5px dashed rgba(47,111,222,.4);outline-offset:16px}}
.export-host{position:fixed;top:0;left:-20000px;width:1080px;pointer-events:none}
.export-host .slide *{box-shadow:none !important}
</style>

uying in the 416? Budget for this before you fall in love with a listing.", "notes": "Mayor Chow was re-elected Oct 26, so the proposed Toronto LTT cut is off the table.", "order": 6, "sources": [{"label": "Ontario: LTT refunds for first-time buyers", "url": "https://ontario.ca/document/land-transfer-tax/land-transfer-tax-refunds-first-time-homebuyers"}, {"label": "TRREB: LTT rebates", "url": "https://trreb.ca/wp-content/files/homeownership/LTT-Tax-Rebates.pdf"}], "status": "research", "timely": "", "title": "In Toronto, you pay land transfer tax twice", "verifiedOn": "2026-11-04", "id": "i06-ltt"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["For federal programs like the Home Buyers’ Plan, you count as a first-time buyer if you haven’t lived in a home you or your current spouse owned in the last four years.", "Ontario’s land transfer tax refund is stricter: any past ownership anywhere in the world disqualifies you, including a home you were gifted or inherited."], "hook": "Owned a place years ago? You might still qualify for these programs.", "order": 7, "sources": [{"label": "Ontario: LTT refund eligibility", "url": "https://ontario.ca/document/land-transfer-tax/land-transfer-tax-refunds-first-time-homebuyers"}, {"label": "MoneySense: FHSA and first-time buyer rules", "url": "https://www.moneysense.ca/columns/ask-a-planner/can-i-still-use-my-fhsa-after-my-spouse-bought-a-condo/"}], "status": "research", "timely": "", "title": "You might still be a “first-time buyer”", "verifiedOn": "2026-11-04", "id": "i07-ftb"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["The Home Buyers’ Plan lets each first-time buyer withdraw $60,000 from their RRSP, or $120,000 for a qualifying couple.", "HBP withdrawals are repaid over 15 years, for example $4,000 a year on $60,000.", "The FHSA and HBP can be used together for the same home: up to $100,000 per person or $200,000 per couple."], "hook": "How a couple could put up to $200K toward a down payment, tax-advantaged.", "order": 8, "sources": [{"label": "Canadian Money Help: HBP 2026", "url": "https://canadianmoneyhelp.ca/?p=360"}, {"label": "FHSA 2026 guide", "url": "https://silaws.com/first-home-savings-account-fhsa-canada-2026-en/"}], "status": "research", "timely": "", "title": "The couple stack: FHSA plus the Home Buyers’ Plan", "verifiedOn": "2026-11-04", "id": "i08-stack"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["The minimum is 5% on the first $500,000 and 10% on the portion between $500,000 and $1.5 million.", "On a $1 million home, that’s $75,000.", "At or above $1.5 million you need at least 20% down, and the mortgage can’t be insured.", "First-time buyers may qualify for a 30-year amortization on an insured purchase, new or resale."], "hook": "What’s the minimum down payment on a $1M home? Most people guess wrong.", "order": 9, "sources": [{"label": "CMHC rules 2026 overview", "url": "https://pegasuslending.com/blog/cmhc-mortgage-rules-2026-canada/"}, {"label": "Down payment changes coverage", "url": "https://nsnews.com/highlights/new-mortgage-rules-will-significantly-lower-down-payments-on-properties-costing-1m-or-more-guidance-shows-9568328"}], "status": "research", "timely": "", "title": "Minimum down payment math (it’s not 20%)", "verifiedOn": "2026-11-04", "id": "i09-down"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["A brokerage must sign a written buyer representation agreement with you before providing client-level services.", "Check the brokerage name, the term, the geographic area, property types, commission, and the holdover clause.", "In April 2026, RECO referred an agent to a discipline hearing over allegations that included falsifying a buyer agreement.", "RECO says holdover clauses aren’t required but are a frequent source of complaints."], "hook": "Your agent will ask you to sign this. Here’s what to check first.", "order": 10, "sources": [{"label": "Buyer rights under TRESA (checklist)", "url": "https://www.filipesells.ca/downloads/buyer-rights-tresa-checklist.pdf"}, {"label": "Money.ca: RECO discipline and BRAs", "url": "https://money.ca/mortgages/homebuying/ontario-buyer-representation-agreement-holdover-clause-reco-discipline"}], "status": "research", "timely": "", "title": "Read your buyer representation agreement first", "verifiedOn": "2026-11-04", "id": "i10-bra"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["Every Toronto residential owner must declare occupancy each year, even if the home is occupied.", "Miss the deadline and the City automatically treats the property as vacant.", "The Vacant Home Tax is 3% of the property’s assessed value.", "The declaration portal opens each November. Last year’s deadline was April 30."], "hook": "You live in your home. You can still get hit with a 3% tax if you miss this.", "notes": "Confirm the official deadline for the 2026 declaration with the City before posting.", "order": 11, "sources": [{"label": "City of Toronto: tax and utilities answers", "url": "https://www.toronto.ca/services-payments/property-taxes-utilities/tax-and-utilities-answers"}, {"label": "WOWA: Vacant Home Tax", "url": "https://wowa.ca/toronto-vacant-home-tax"}], "status": "designed", "timely": "Portal opens in November", "title": "The yearly declaration new Toronto owners can’t skip", "verifiedOn": "2026-11-04", "id": "i11-vht"}, {"createdAt": "2026-11-06T22:00:00Z", "facts": ["Budget 2026 was tabled on November 5, 2026.", "Ottawa proposes raising the price ceiling for optional mortgage insurance on buyers with 20% down from $1 million to $1.5 million. No start date has been confirmed.", "The foreign buyer ban on existing homes is proposed to extend to January 1, 2029, with new residential properties exempted.", "These are proposals, not law yet."], "hook": "The federal budget just dropped. Here’s what matters if you’re buying.", "notes": "Re-check status before posting; details may change as the budget moves through Parliament.", "order": 12, "sources": [{"label": "Canadian Mortgage Professional, Nov 6", "url": "https://www.mpamag.com/ca/mortgage-industry/industry-trends/budget-2026-the-biggest-housing-announcements-for-brokers/596507"}, {"label": "Bloomberg, Nov 5", "url": "https://www.bloomberg.com/news/articles/2026-11-05/canada-budget-2026-carney-relaxes-foreign-buyer-ban-adds-billions-for-housing"}], "status": "research", "timely": "Proposed, not law yet", "title": "Budget 2026: what it could mean for buyers", "verifiedOn": "2026-11-06", "id": "i12-budget"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["You have to qualify at your mortgage rate plus 2%, or 5.25%, whichever is higher.", "Offered 4.00%? You’re tested at 6.00%.", "It applies to both insured and uninsured mortgages at federally regulated lenders.", "Canada’s banking regulator kept the rule unchanged in January 2026."], "hook": "Your bank tests you at a higher rate than you’ll actually pay. Here’s the math.", "notes": "Good as a Big number slide: “+2%”. The 4.00% example is just an illustration, not a quoted rate.", "order": 13, "sources": [{"label": "TRREB, Mortgage stress test", "url": "https://trreb.ca/wp-content/files/homeownership/Mortgage-Stress-Test.pdf"}, {"label": "Loans Canada, stress test in 2026", "url": "https://loanscanada.ca/mortgage/the-canadian-mortgage-stress-test/"}], "status": "research", "timely": "Re-check if OSFI announces a change", "title": "The stress test, in one line", "verifiedOn": "2026-11-07", "id": "i13-stress"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["5% to 9.99% down: 4.00% of your mortgage.", "10% to 14.99% down: 3.10%.", "15% to 19.99% down: 2.80%. At 20% or more, no insurance needed.", "Choosing a 30-year amortization adds 0.20%.", "Example: a $500,000 home with 5% down means a $475,000 mortgage and a $19,000 premium, usually added to the mortgage.", "In Ontario, 8% sales tax on the premium is paid in cash at closing."], "hook": "Under 20% down? Here’s the fee most buyers don’t see coming.", "notes": "Works as a Checklist or List slide: four tiers. Rates are CMHC’s; Sagen and Canada Guaranty use the same schedule.", "order": 14, "sources": [{"label": "CMHC, premium rates", "url": "https://cmhc-schl.gc.ca/en/finance-and-investing/mortgage-loan-insurance/the-resource/mortgage-loan-insurance-and-premiums"}, {"label": "CMHC premium example with Ontario tax", "url": "https://calcuris.com/ca/cmhc-insurance-calculator/"}], "status": "research", "timely": "", "title": "What mortgage insurance costs", "verifiedOn": "2026-11-07", "id": "i14-cmhc"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["Claim $10,000 on line 31270 of your tax return, the “home buyers’ amount”.", "It was worth up to $1,500. Because the lowest federal tax rate dropped, it’s worth about $1,400 for homes bought in 2026.", "You can split it with your spouse, but the total claim can’t go over $10,000.", "It lowers tax you owe. It isn’t paid out as cash if you owe no tax."], "hook": "Bought your first home this year? Don’t miss this line on your taxes.", "notes": "Correction to watch: many sites still say $1,500. That was true at a 15% rate; the lowest federal rate is now 14%. Confirm the exact figure on CRA’s page in tax season before posting.", "order": 15, "sources": [{"label": "CRA, line 31270", "url": "https://www.cra-arc.gc.ca/hbtc/"}, {"label": "H&R Block, how much you can claim (2026)", "url": "https://www.hrblock.ca/blog/first-time-home-buyer-tax-credit-how-much-can-you-claim"}], "status": "research", "timely": "Best posted Feb to April (tax season)", "title": "The first-home tax credit most people forget", "verifiedOn": "2026-11-07", "id": "i15-hba"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["1 year: workmanship and materials, Building Code violations, and whether the home is fit to live in.", "2 years: water getting in through the basement or foundation, plus the electrical, plumbing and heating systems.", "7 years: major structural defects.", "All three start on your possession date, and the warranty stays with the home if it’s sold within seven years."], "hook": "New build? Your warranty comes in three parts: 1, 2 and 7.", "notes": "Great as a Steps or Tip slide (1 / 2 / 7). Coverage is summarized; whether a specific item qualifies is Tarion’s call.", "order": 16, "sources": [{"label": "Tarion, warranty coverage brochure", "url": "https://www.tarion.com/sites/default/files/2022-12/Print%20Condo%20Warranty%20Brochure%20-%20FINAL.pdf"}, {"label": "Tarion, 5 questions new owners ask", "url": "https://www.tarion.com/media/5-questions-we-often-get-new-home-owners"}], "status": "research", "timely": "", "title": "New build warranty: 1, 2 and 7", "verifiedOn": "2026-11-07", "id": "i16-tarion"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["It’s called a status certificate. It shows the condo’s finances, reserve fund, and any special assessments or lawsuits the corporation has disclosed.", "The condo can charge up to $100, including taxes.", "It must be delivered within 10 days of the request and payment.", "Most buyers make their offer conditional on their lawyer reviewing it."], "hook": "Buying a resale condo? Ask for this before you go firm.", "notes": "Simple Big number slide: “$100 · 10 days”.", "order": 17, "sources": [{"label": "Condominium Authority of Ontario, status certificates", "url": "https://www.condoauthorityontario.ca/knowledge-base/what-is-a-status-certificate/"}, {"label": "Nihang Law, status certificates (Sept 2026)", "url": "https://www.nihanglaw.ca/blog-status-certificate-ontario-condo/"}], "status": "research", "timely": "", "title": "The condo document to read before you go firm", "verifiedOn": "2026-11-07", "id": "i17-status"}, {"createdAt": "2026-11-07T14:00:00Z", "facts": ["Ontario land transfer tax on $700,000: $10,475.", "Toronto adds its own land transfer tax: another $10,475.", "Total: $20,950.", "First-time buyer rebates: up to $4,000 (Ontario) plus $4,475 (Toronto) = $8,475.", "First-time buyer pays: $12,475."], "hook": "Buying a $700K home in Toronto? Here’s your land transfer tax, before and after first-time rebates.", "notes": "I worked out the numbers from the published rates (0.5%, 1%, 1.5%, 2% brackets, identical for Ontario and Toronto up to $2M). First-time eligibility rules are in the “First-time buyer” idea. Ask a lawyer to confirm for a real purchase.", "order": 18, "sources": [{"label": "City of Toronto, MLTT rates", "url": "https://www.toronto.ca/services-payments/property-taxes-utilities/municipal-land-transfer-tax-mltt/municipal-land-transfer-tax-mltt-rates-and-fees"}, {"label": "Ontario land transfer tax rates", "url": "https://isure.ca/inews/land-transfer-tax-in-ontario/"}], "status": "research", "timely": "", "title": "Land transfer tax on a $700K Toronto home", "verifiedOn": "2026-11-07", "id": "i18-ltt700"}, {"createdAt": "2026-11-07T01:20:05.975Z", "facts": ["Most homes are detached and semi-detached houses, two to three storeys tall, built in the late 1800s and early 1900s.", "You’ll also find row houses, plus mid- and high-rise buildings, mostly along Walmer Road, Spadina Road and St. George Street.", "About 90% of buildings in the City’s West Annex study area are one to three storeys.", "Brick is the main material on most street-facing fronts."], "hook": "Thinking of the Annex? Here’s what you’ll actually be shopping for.", "notes": "The numbers come from the City’s West Annex study area (roughly Bedford Road to Bathurst, Bloor to Dupont), not the whole neighbourhood. Traditional Annex boundaries: Bloor to Dupont, Bathurst to Avenue Road. The City’s own “Annex” neighbourhood is bigger and runs east to Yonge, so say which one you mean. If you add sale counts or prices, pull them fresh from TRREB/MLS and date them.", "order": 1794014405975, "sources": [{"label": "City of Toronto, West Annex heritage study boards (Oct 2025)", "url": "https://www.toronto.ca/wp-content/uploads/2025/10/96a3-city-planning-west-annex-community-consultation-boards-maps.pdf"}, {"label": "The Annex (boundaries, overview)", "url": "https://en.wikipedia.org/wiki/The_Annex"}], "status": "research", "timely": "", "title": "What the Annex actually looks like: homes you’ll find", "verifiedOn": "2026-11-07", "id": "imw5puuzbppapf"}, {"createdAt": "2026-11-07T01:20:30.060Z", "facts": ["Developer Simeon Janes named his subdivision “The Toronto Annex”, and Toronto annexed the area in 1887. The western part followed in 1888.", "About 70% of buildings in the City’s West Annex study area went up between 1899 and 1919.", "The “Annex style” house mixes big rounded Romanesque arches with Queen Anne details like turrets.", "Architect E.J. Lennox’s 1887 house at 37 Madison Avenue set the template for the style."], "hook": "Ever wonder why the Annex looks so storybook? Here’s why!", "notes": "Checked: name origin, 1887 annexation, Annex style, Lennox. I left out famous past residents: the lists online aren’t reliably sourced. The 70% figure covers the City’s West Annex study area only.", "order": 1794014430060, "sources": [{"label": "City of Toronto, West Annex heritage study boards (Oct 2025)", "url": "https://www.toronto.ca/wp-content/uploads/2025/10/96a3-city-planning-west-annex-community-consultation-boards-maps.pdf"}, {"label": "Globe and Mail on the Annex style and 37 Madison Ave", "url": "https://www.theglobeandmail.com/real-estate/a-stylish-home-and-torontos-own/article18435513"}, {"label": "Annex Residents’ Association, architectural history", "url": "https://annex.nationbuilder.com/architectural_history"}], "status": "research", "timely": "", "title": "Why the Annex has so many century-old homes", "verifiedOn": "2026-11-07", "id": "imw5pvdkclzu8c"}, {"createdAt": "2026-11-07T01:20:32.822Z", "facts": ["The East Annex has been a Heritage Conservation District since 1994, roughly Bedford Road to Avenue Road, Bloor to Davenport.", "Madison Avenue, from Bloor to Dupont, became a Heritage Conservation District in 2019.", "The City is studying the rest of the West Annex (Bedford to Bathurst, Bloor to Dupont) as a possible district. It isn’t designated yet.", "Inside a district, changes to the outside of a house that people can see from the street usually need a heritage permit. Interior work usually doesn’t. Each district’s plan sets the exact rules.", "Before you go firm, have your lawyer check whether the house is in a district or on the City’s Heritage Register."], "hook": "Dreaming of renovating an Annex gem? Check this first!", "notes": "Check the City’s West Annex Phase II page right before posting: if Council designates it, the third fact changes. The permit rule is general; keep the wording “usually” and point people to the district plan rather than promising what they can or can’t change.", "order": 1794014432822, "sources": [{"label": "City of Toronto, West Annex Phase II HCD study", "url": "https://www.toronto.ca/city-government/planning-development/planning-studies-initiatives/west-annex-phase-2-heritage-conservation-district-study/"}, {"label": "Ontario Heritage Trust, East Annex designation", "url": "https://heritagetrust.on.ca/oha/details/file?id=12171"}, {"label": "Example of HCD permit rules (South Rosedale)", "url": "https://southrosedale.org/?p=5905"}], "status": "research", "timely": "Re-check the West Annex study status before posting", "title": "Annex heritage districts: what it means for renovations", "verifiedOn": "2026-11-07", "id": "imw5pvfp2dp1v0"}, {"createdAt": "2026-11-07T01:20:34.967Z", "facts": ["Bloor Street West, Dupont Street and Mirvish Village are the Annex’s main shopping strips, each with its own Business Improvement Area.", "Shops and restaurants cluster near Bloor and Dupont, while most side streets stay residential."], "hook": "Your future neighbourhood has the best weekend spots. Let’s explore!", "notes": "I can only confirm the area-level facts. Pick the specific spots yourself and check each one is open right before you post (names, hours and owners change often). Don’t imply a sponsorship that isn’t there, and ask before featuring a business’s logo or interior photos. Check your brokerage’s advertising rules for the post.", "order": 1794014434967, "sources": [{"label": "City of Toronto, West Annex heritage study boards (Oct 2025)", "url": "https://www.toronto.ca/wp-content/uploads/2025/10/96a3-city-planning-west-annex-community-consultation-boards-maps.pdf"}], "status": "research", "timely": "Confirm each named spot the week you post", "title": "Eat, browse and wander: Annex local favourites", "verifiedOn": "2026-11-07", "id": "imw5pvhcn3zvyo"}, {"createdAt": "2026-11-07T01:20:36.429Z", "facts": ["The Annex sits just north of the University of Toronto’s St. George campus, and some university buildings are inside the neighbourhood.", "Homes range from single-family houses to high-rise apartments, so very different households share the same streets.", "Churches, schools and community services are mixed in among the houses."], "hook": "Who lives in the Annex? A friendly mix, actually!", "notes": "I couldn’t confirm current population numbers from one clear official source: the City’s neighbourhood profile uses a bigger “Annex” area (east to Yonge), so websites quote very different figures. Avoid percentages (renters, income, ages) unless you pull them from the City’s Neighbourhood Profile for Annex (#95) and say so. I also left out famous residents.", "order": 1794014436429, "sources": [{"label": "City of Toronto, West Annex heritage study boards (Oct 2025)", "url": "https://www.toronto.ca/wp-content/uploads/2025/10/96a3-city-planning-west-annex-community-consultation-boards-maps.pdf"}], "status": "research", "timely": "", "title": "Annex neighbours: students, families and creatives", "verifiedOn": "2026-11-07", "id": "imw5pvih9bcvnj"}, {"createdAt": "2026-11-07T01:20:37.069Z", "facts": ["Four subway stations serve the area: St. George, Spadina, Bathurst and Dupont.", "St. George and Spadina connect Line 1 and Line 2, so you can head north, south, east or west without going outside.", "St. George Street has bike lanes."], "hook": "Car-free living in the Annex? Here’s how it works!", "notes": "I didn’t add a Walk Score: it changes, so if you use one, quote the source and date. Bloor Street’s bike lanes have been in dispute between the province and the City, so check their status before mentioning them. Check TTC service alerts for any station closures the week you post.", "order": 1794014437069, "sources": [{"label": "City of Toronto, West Annex heritage study boards (Oct 2025)", "url": "https://www.toronto.ca/wp-content/uploads/2025/10/96a3-city-planning-west-annex-community-consultation-boards-maps.pdf"}, {"label": "TTC, Spadina Station", "url": "https://www.ttc.ca/en/subway-stations/spadina-station"}], "status": "research", "timely": "", "title": "Getting around the Annex without a car", "verifiedOn": "2026-11-07", "id": "imw5pviz13zb8q"}]</script>

<script>
/* =========================== constants =========================== */
const DEFAULT_BRAND = {
  name:'', handle:'', extra:'',
  bg:'#EAE1D5', card:'#FFFFFF', accent:'#A68C72', ink:'#2E2823', soft:'#F5F0E9', sage:'#DDE7DC', tint:'#B7CFBA', tintStrength:'16',
  displayFont:'Playfair Display', bodyFont:'Jost', scriptFont:'', tipsFont:'Great Vibes',
  headshotId:'', headshotData:'', fontFiles:[]
};
const DIM = {post:{w:1080,h:1350,label:'Post 4:5'}, story:{w:1080,h:1920,label:'Story 9:16'}};
const LAYOUTS = {cover:'Cover', statement:'Statement', split:'Photo + text', list:'List', checklist:'Checklist', steps:'Steps', stat:'Big number', tip:'Tip', compare:'Do vs don’t', mythfact:'Myth vs fact', quote:'Quote', cta:'Jen’s Tips'};
const JEN_TIPS = 'Jen’s Tips';
const FIRST_STARTER_IDEAS = ['i01-fhsa','i02-hst','i03-rates','i04-market','i05-cooling','i06-ltt','i07-ftb','i08-stack','i09-down','i10-bra','i11-vht','i12-budget'];
const FIRST_STARTER_PHOTOS = Array.from({length:30},(_,k)=>'p'+String(k+1).padStart(2,'0'));
const BGS = {photo:'Photo', sand:'Sand', sage:'Sage', white:'White', taupe:'Accent', ink:'Deep'};
const STATUS = {research:'Researched', scripted:'Scripted', designed:'Designed', unverified:'Needs fact-check'};
const FORMATS = ['Reel','Carousel','Single post','Story'];
const PHOTO_CATS = {interior:'Interior', nature:'Nature', abstract:'Abstract'};
const ELNAME = {mark:'Quote mark', checks:'Checklist', cmp:'Comparison', tag:'Tip label', heading:'Headline', accent:'Italic line', body:'Body text', button:'Button', items:'List', number:'Big number', myth:'Myth card', fact:'Fact card', headshot:'Headshot', sig:'Your name', rule:'Divider line', foot:'Handle and small print'};
const ICON = {
  left:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 10h10M4 14h16M4 18h10"/></svg>',
  center:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 10h10M4 14h16M7 18h10"/></svg>',
  right:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M10 10h10M4 14h16M10 18h10"/></svg>'
};

const S = {
  view:'carousels', brand:{...DEFAULT_BRAND}, ideas:[], carousels:[], photos:[],
  loaded:{ideas:false,carousels:false}, editing:null, slideIdx:0, sel:null, ideaFilter:'all',
  usedQuery:'', bsTheme:'', photoCat:'interior', pickCat:'all', suggestions:[], busy:{}, caps:{}, mode:'loading'
};

/* =========================== helpers =========================== */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/\n/g,'<br>');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
const stable = o => JSON.stringify(o, (k,v)=> v && typeof v==='object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}) : v);
const safeUrl = u => /^https?:\/\//i.test(String(u||'')) ? u : '';
const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return ''; const d=new Date(iso.length===10?iso+'T12:00:00':iso); return isNaN(d)?'':d.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'}); };
const slug = s => (String(s||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48) || 'post');
const fmtOf = d => (d && d.format==='story') ? 'story' : 'post';
let toastTimer;
function toast(msg, action){
  const t=$('#toast'); t.textContent=msg;
  if(action){ const b=document.createElement('button'); b.className='toast-act'; b.textContent=action.label; b.addEventListener('click',()=>{ t.hidden=true; action.fn(); }); t.appendChild(b); }
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true, action?7000:4200);
}
async function getCap(name){
  if(name in S.caps) return S.caps[name];
  let v=null;
  try{ if(window.claude && typeof window.claude.use==='function') v = await window.claude.use(name); }catch(e){ v=null; }
  S.caps[name]=v; return v;
}
function lsGet(k,f){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):f; }catch(e){ return f; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
const IN_CLAUDE = !!(window.claude && typeof window.claude.use==='function');
const IDB = {
  db:null,
  open(){ return this.db || (this.db = new Promise((res,rej)=>{ const r=indexedDB.open('content-studio',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async get(k){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return undefined; } },
  async set(k,v){ try{ const db=await this.open(); await new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); return true; }catch(e){ return false; } }
};
async function saveFile({filename, data}){
  const dl = await getCap('downloads');
  if(dl) return dl.save({filename, data});
  if(IN_CLAUDE){ const err=new Error('unavailable'); err.code='unavailable'; throw err; }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return {status:'saved'};
}

/* =========================== storage =========================== */
const Store = {
  mode:'loading', db:null, base:null, sent:{}, timers:{},
  async init(){
    const [db,user] = await Promise.all([getCap('db'), getCap('user')]);
    if(db && user){ try{ const id = await user.id(); if(id){ this.db=db; this.base='data/users/'+id; this.mode='db'; } }catch(e){} }
    if(this.mode==='db') this.subscribe(); else await this.useLocal();
  },
  async useLocal(){
    this.mode='local';
    const g = async k => { let v=await IDB.get('cs.'+k); if(v===undefined){ const old=lsGet('cs.'+k,undefined); if(old!==undefined){ v=old; IDB.set('cs.'+k,old); } } return v; };
    S.ideas = (await g('ideas'))||[]; S.carousels = (await g('carousels'))||[]; S.photos = (await g('photos'))||[];
    if(!IN_CLAUDE){
      try{
        const starter = JSON.parse(document.getElementById('starter-ideas').textContent);
        let seen = await IDB.get('cs.starterIdeasSeen');
        if(!Array.isArray(seen)) seen = (await IDB.get('cs.starterAdded')) ? FIRST_STARTER_IDEAS : [];
        const have=new Set(S.ideas.map(i=>i.id)), seenSet=new Set(seen);
        const add=starter.filter(i=>!have.has(i.id) && !seenSet.has(i.id));
        if(add.length){ S.ideas=[...S.ideas, ...add]; await IDB.set('cs.ideas', clone(S.ideas)); }
        await IDB.set('cs.starterIdeasSeen', [...new Set([...seen, ...starter.map(i=>i.id)])]);
      }catch(e){}
    }
    S.brand = {...clone(DEFAULT_BRAND), ...((await g('brand'))||{})};
    S.loaded={ideas:true,carousels:true};
    try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    if(!IN_CLAUDE) setTimeout(()=>this.addStarterPhotos(), 50);
    setStatus(IN_CLAUDE?'Saved in this browser only':'Saved on this device. Download a backup now and then.'); applyBrand();
  },
  async addStarterPhotos(){
    let list; try{ list=JSON.parse(document.getElementById('starter-photos').textContent); }catch(e){ return; }
    let seen=await IDB.get('cs.starterPhotosSeen');
    if(!Array.isArray(seen)) seen=(await IDB.get('cs.starterPhotosAdded')) ? FIRST_STARTER_PHOTOS : [];
    const seenSet=new Set(seen), have=new Set(S.photos.map(p=>p.id));
    list.forEach(m=>{ if(have.has(m.id)) seenSet.add(m.id); });
    const todo=list.filter(m=>!seenSet.has(m.id));
    if(!todo.length){ await IDB.set('cs.starterPhotosSeen',[...seenSet]); return; }
    toast(`Adding ${todo.length} photos to your library…`);
    let added=0, failed=0;
    for(const m of todo){
      try{ let r=await fetch('photos/'+m.file).catch(()=>null); if(!r||!r.ok) r=await fetch(m.file); if(!r.ok) throw 0; const data=await blobToData(await r.blob());
        S.photos.push({id:m.id, assetId:'', data, name:m.name, category:m.category, order:m.order, compact:true, createdAt:'2026-11-07T12:00:00Z'}); seenSet.add(m.id); added++; }
      catch(e){ failed++; }
    }
    if(added){ await this.saveLocal('photos',true); updateCounts(); if(S.view==='photos') render(); }
    await IDB.set('cs.starterPhotosSeen',[...seenSet]);
    if(failed && added) toast(`${added} library photos added. ${failed} couldn’t be found; they’ll be tried again next time.`);
    else if(added) toast(`${added} photos added to your library`);
  },
  lt:{},
  saveLocal(k, now=false){
    clearTimeout(this.lt[k]);
    const run = async()=>{ delete this.lt[k]; const ok=await IDB.set('cs.'+k, k==='brand'?clone(S.brand):clone(S[k])); if(!ok) toast('Couldn’t save on this device. It may be out of storage space.'); };
    if(now) return run();
    this.lt[k]=setTimeout(run,300);
  },
  flushLocal(){ Object.keys(this.lt).forEach(k=>this.saveLocal(k,true)); },
  subscribe(){
    const timer = setTimeout(()=>{ if(!S.loaded.ideas) setStatus('Still connecting to your saved data…'); },10000);
    this.db.collection(this.base+'/studio/ideas').onSnapshot(snap=>{
      clearTimeout(timer);
      const next = snap.docs.map(d=>({...clone(d.data()||{}), id:d.id}));
      const changed = stable(next)!==stable(S.ideas);
      S.ideas = next; S.loaded.ideas=true; setStatus('Saved to your account');
      if(changed && !isBusyUI()) render(); else updateCounts();
    }, ()=> setStatus('Couldn’t reach your saved ideas. Changes may not save.'));
    this.db.collection(this.base+'/studio/carousels').onSnapshot(snap=>{
      let structural=false;
      const incoming = snap.docs.map(d=>({...clone(d.data()||{}), id:d.id}));
      const merged = incoming.map(c=>{
        const local = S.carousels.find(x=>x.id===c.id);
        const json = stable(c);
        if(local && (this.timers['car:'+c.id] || this.sent['car:'+c.id]===json)) return local;
        if(!local || stable(local)!==json) structural=true;
        return c;
      });
      const pendingNew = S.carousels.filter(c=>!incoming.find(x=>x.id===c.id) && this.timers['car:'+c.id]);
      if(S.carousels.length!==merged.length+pendingNew.length) structural=true;
      S.carousels = [...merged, ...pendingNew]; S.loaded.carousels=true;
      if(structural && !isBusyUI()) render(); else updateCounts();
    }, ()=> setStatus('Couldn’t reach your saved posts.'));
    this.db.collection(this.base+'/studio/photos').onSnapshot(snap=>{
      const next = snap.docs.map(d=>({...clone(d.data()||{}), id:d.id}));
      const changed = stable(next)!==stable(S.photos);
      S.photos = next;
      if(changed && S.view==='photos' && !isBusyUI()) render(); else updateCounts();
    });
    this.db.doc(this.base+'/brand').onSnapshot(d=>{
      if(this.timers.brand) return;
      const next = {...clone(DEFAULT_BRAND), ...(d.exists ? clone(d.data()||{}) : {})};
      if(stable(next)!==stable(S.brand)){ S.brand=next; applyBrand(); if(!isBusyUI()) render(); }
    });
  },
  async putIdea(idea){
    const i = S.ideas.findIndex(x=>x.id===idea.id);
    if(i>=0) S.ideas[i]=idea; else S.ideas.push(idea);
    if(this.mode==='db'){ const {id,...rest}=idea; try{ await this.db.doc(this.base+'/studio/ideas/'+id).set(rest); }catch(e){ toast('That change didn’t save. Check your connection.'); } }
    else this.saveLocal('ideas');
  },
  async delIdea(id){
    S.ideas = S.ideas.filter(x=>x.id!==id);
    if(this.mode==='db'){ try{ await this.db.doc(this.base+'/studio/ideas/'+id).delete(); }catch(e){ toast('Couldn’t delete that idea.'); } }
    else this.saveLocal('ideas');
  },
  queueCarousel(car, delay=700){
    car.updatedAt = new Date().toISOString();
    const key='car:'+car.id;
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(()=>this.flushCarousel(car.id),delay);
    if(this.mode!=='db') this.saveLocal('carousels');
  },
  async flushCarousel(id){
    const key='car:'+id; delete this.timers[key];
    const car = S.carousels.find(c=>c.id===id); if(!car) return;
    if(this.mode==='db'){
      const {id:_,...rest}=car; this.sent[key]=stable(car);
      try{ await this.db.doc(this.base+'/studio/carousels/'+id).set(rest); }catch(e){ toast('Your design didn’t save. Check your connection.'); }
    } else this.saveLocal('carousels');
  },
  async delCarousel(id){
    clearTimeout(this.timers['car:'+id]); delete this.timers['car:'+id];
    S.carousels = S.carousels.filter(c=>c.id!==id);
    if(this.mode==='db'){ try{ await this.db.doc(this.base+'/studio/carousels/'+id).delete(); }catch(e){ toast('Couldn’t delete that design.'); } }
    else this.saveLocal('carousels');
  },
  async putPhoto(p){
    S.photos.push(p);
    if(this.mode==='db'){ const {id,...rest}=p; try{ await this.db.doc(this.base+'/studio/photos/'+id).set(rest); }catch(e){ toast('That photo didn’t save to your library.'); } }
    else this.saveLocal('photos');
  },
  async delPhoto(id){
    S.photos = S.photos.filter(p=>p.id!==id);
    if(this.mode==='db'){ try{ await this.db.doc(this.base+'/studio/photos/'+id).delete(); }catch(e){ toast('Couldn’t delete that photo.'); } }
    else this.saveLocal('photos');
  },
  async updatePhoto(p){
    const i=S.photos.findIndex(x=>x.id===p.id); if(i>=0) S.photos[i]=p;
    if(this.mode==='db'){ const {id,...rest}=p; try{ await this.db.doc(this.base+'/studio/photos/'+id).set(rest); }catch(e){ toast('That change didn’t save.'); } }
    else this.saveLocal('photos');
  },
  queueBrand(){
    clearTimeout(this.timers.brand);
    this.timers.brand = setTimeout(async()=>{
      delete this.timers.brand;
      if(this.mode==='db'){ try{ await this.db.doc(this.base+'/brand').set(clone(S.brand)); }catch(e){ toast('Brand settings didn’t save.'); } }
      else this.saveLocal('brand',true);
    },600);
  }
};
function setStatus(t){ $('#store-status').textContent=t; }
function isTyping(){ const a=document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#main').contains(a); }
function isBusyUI(){ return isTyping() || !!drag || !!tdrag || $('#dlg').open; }

/* =========================== brand =========================== */
const loadedFontLinks = new Set(['Playfair Display','Jost']);
function loadGoogleFont(family){
  family=(family||'').trim(); if(!family || loadedFontLinks.has(family)) return;
  if((S.brand.fontFiles||[]).some(f=>f.family===family)) return;
  loadedFontLinks.add(family);
  const fam = encodeURIComponent(family).replace(/%20/g,'+');
  const link = document.createElement('link'); link.rel='stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${fam}:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap`;
  link.onerror = ()=>{ link.href=`https://fonts.googleapis.com/css2?family=${fam}&display=swap`; link.onerror=null; };
  document.head.appendChild(link);
}
let fontFaceEl;
function applyBrand(){
  const b=S.brand;
  [b.displayFont,b.bodyFont,b.scriptFont,b.tipsFont||'Great Vibes'].forEach(loadGoogleFont);
  if(!fontFaceEl){ fontFaceEl=document.createElement('style'); document.head.appendChild(fontFaceEl); }
  fontFaceEl.textContent = (b.fontFiles||[]).map(f=>`@font-face{font-family:"${f.family.replace(/["\\]/g,'')}";src:url("${f.data||('/_blob/'+f.assetId)}");font-display:swap;}`).join('\n');
  $('#bm-name').textContent = b.name || 'Content Studio';
}
function fam(name, fallback){ return name ? `'${name.replace(/['"]/g,'')}', ${fallback}` : fallback; }

}
function imgSrc(id,data){ return data ? data : (id ? '/_blob/'+id : ''); }

/* =========================== slide rendering =========================== */
function hSize(text, base){
  const n=(text||'').length;
  const k = n<=16?1 : n<=28?.88 : n<=44?.76 : n<=64?.64 : n<=90?.54 : .46;
  return Math.round(base*k*1.08);
}
function slideHTML(s, i, n, fmt='post', opts={}){
  const b=S.brand, split=s.layout==='split', bg=(split&&(s.bg||'sand')==='photo')?'sand':(s.bg||'sand'), photo=bg==='photo';
  const scale = photo ? .82 : 1;
  const scriptCls = b.scriptFont ? ' script' : '';
  const pos = s.pos||{}, al = s.align||{};
  const E = (key, tag, cls, inner, style='') => {
    const p=pos[key], a=al[key];
    const st = (p?`transform:translate(${p.x||0}px,${p.y||0}px);`:'') + style;
    return `<${tag} class="${cls}${a?' al-'+a:''}${opts.sel===key?' is-sel':''}" data-el="${key}"${st?` style="${st}"`:''}>${inner}</${tag}>`;
  };
  const H = (t,base)=> t ? E('heading','h2','h',br(t),`font-size:${hSize(t,base*scale)}px;`) : '';
  const A = (t,size)=> t ? E('accent','p','acc'+scriptCls,br(t),`font-size:${Math.round(size*scale*1.1)}px;`) : '';
  const B = t => { if(!t) return ''; const n=t.length; return E('body','p','body',br(t),`font-size:${Math.round((n<=110?52:n<=180?47:43)*(photo?.9:1))}px;`); };
  const P = t => t ? E('button','div','pill',esc(t)) : '';
  const items = (s.items||[]).filter(x=>x && x.trim());
  let inner='';
  switch(s.layout){
    case 'cover': inner = H(s.heading,120) + A(s.accent,58) + B(s.body) + P(s.button); break;
    case 'statement': inner = H(s.heading,124) + A(s.accent,56) + (s.body?E('rule','div','rule',''):'') + B(s.body) + P(s.button); break;
    case 'list': {
      const fs = Math.round((items.length>5?38:items.length>3?42:46)*scale);
      inner = H(s.heading,92) + A(s.accent,48) + (items.length?E('items','div','items',items.map(t=>`<div class="item" style="font-size:${fs}px">${esc(t)}</div>`).join('')):'') + B(s.body) + P(s.button);
      break; }
    case 'steps': {
      const fs = Math.round((items.length>4?39:44)*scale);
      inner = H(s.heading,88) + A(s.accent,48) + (items.length?E('items','ol','steps',items.map((t,k)=>`<li style="font-size:${fs}px"><span class="n">${k+1}</span><span>${esc(t)}</span></li>`).join(''),`gap:${items.length>4?22:30}px;`):'') + B(s.body) + P(s.button);
      break; }
    case 'stat': {
      const num = s.number||'';
      const size = Math.round((num.length<=4?300:num.length<=7?240:num.length<=10?180:130)*scale);
      inner = (num?E('number','p','big',esc(num),`font-size:${size}px;`):'') + H(s.heading,72) + A(s.accent,46) + B(s.body) + P(s.button);
      break; }
    case 'mythfact':
      inner = H(s.heading,80) + `<div class="mf">${E('myth','div','card myth',`<span class="lbl${scriptCls}">Myth</span><span class="txt">${br(s.myth||'')}</span>`)}${E('fact','div','card fact',`<span class="lbl${scriptCls}">Fact</span><span class="txt">${br(s.fact||'')}</span>`)}</div>` + B(s.body);
      break;
    case 'cta': {
      const hs = imgSrc(b.headshotId,b.headshotData);
      inner = E('headshot','div','headshot','',hs?`background-image:url('${hs}');`:'') + H(s.heading,112) + A(s.accent,48) + B(s.body) + P(s.button) +
        ((b.name||b.extra)?E('sig','div','sig',`${b.name?`<b>${esc(b.name)}</b>`:''}${b.extra?`<span>${esc(b.extra)}</span>`:''}`):'');
      break; }
    case 'checklist': {
      const fs = Math.round((items.length>5?38:items.length>3?42:46)*scale);
      inner = H(s.heading,92) + A(s.accent,48) + (items.length?E('checks','div','checks',items.map(t=>`<div class="check" style="font-size:${fs}px"><span class="ck">✓</span><span>${esc(t)}</span></div>`).join('')):'') + B(s.body) + P(s.button);
      break; }
    case 'tip':
      inner = (s.number?E('tag','div','tag',esc(s.number)):'') + H(s.heading,104) + A(s.accent,52) + B(s.body) + P(s.button);
      break;
    case 'compare': {
      const it2=(s.items2||[]).filter(x=>x && x.trim());
      const n=Math.max(items.length,it2.length), fs=Math.round((n>4?38:n>2?42:46)*Math.max(scale,.94));
      const col=(cls,ic,title,list)=>`<div class="cmp-col ${cls}"><div class="cmp-t"><span class="ic">${ic}</span><span>${esc(title)}</span></div>${list.map(t=>`<div class="cmp-i" style="font-size:${fs}px">${esc(t)}</div>`).join('')}</div>`;
      inner = H(s.heading,84) + E('cmp','div','cmp', col('do','✓',s.leftTitle||'Do this',items) + col('dont','✕',s.rightTitle||'Not this',it2)) + B(s.body);
      break; }
    case 'quote':
      inner = E('mark','div','qmark','“') + (s.heading?E('heading','h2','h quote-text',br(s.heading),`font-size:${hSize(s.heading,96*scale)}px;`):'') + A(s.accent,46) + B(s.body) + P(s.button);
      break;
    case 'split':
      inner = H(s.heading,96) + A(s.accent,50) + B(s.body) + P(s.button);
      break;
    default: inner = H(s.heading,110) + B(s.body);
  }
  const footBits = `${s.footnote?`<span class="fn">${br(s.footnote)}</span>`:''}${s.showHandle&&b.handle?`<span>${esc(b.handle)}</span>`:''}`;
  const footIn = photo && footBits ? E('foot','div','foot-in',footBits) : '';
  const footOut = !photo && footBits ? E('foot','div','foot',footBits) : '';
  const src = (photo||split) ? imgSrc(s.photoId,s.photoData) : '';
  const ph = photo ? `<div class="ph" style="${src?`background-image:url('${src}')`:''}"></div><div class="ph-veil"></div>` : '';
  const sp = split ? `<div class="split-ph" style="${src?`background-image:url('${src}')`:''}"></div>` : '';
  return `<div class="slide fmt-${fmt} bg-${bg} lay-${s.layout}">${ph}${sp}${photo?'':'<div class="tint"></div>'}<div class="panel">${inner}${footIn}</div>${footOut}</div>`;
}
function frameHTML(s,i,n,fmt='post',opts={}){ return `<div class="frame fmt-${fmt}${opts.live?' live':''}"><div class="brand-scope" style="${esc(brandVars())}">${slideHTML(s,i,n,fmt,opts)}</div></div>`; }
const ro = new ResizeObserver(entries=>{ for(const e of entries){ e.target.style.setProperty('--s', (e.contentRect.width/1080).toFixed(4)); } });
function fitFrames(root=document){ root.querySelectorAll('.frame').forEach(f=>{ f.style.setProperty('--s',(f.clientWidth/1080).toFixed(4)); ro.observe(f); }); }

function usageMap(){
  const m={};
  S.carousels.forEach(c=>{ const seen=new Set(); (c.slides||[]).forEach(s=>{ const k=(s.bg==='photo'||s.layout==='split')?(s.photoId||s.photoData):''; if(k && !seen.has(k)){ seen.add(k); const u=m[k]||(m[k]={posted:0,drafts:0}); if(c.posted) u.posted++; else u.drafts++; } }); });
  return m;
}
function libraryPhotos(){
  const use=usageMap(), none={posted:0,drafts:0};
  const lib = S.photos.map(p=>{ const u=use[p.assetId||p.data]||none; return {...p, src:imgSrc(p.assetId,p.data), used:u.posted, drafts:u.drafts}; });
  const known = new Set(lib.map(p=>p.assetId||p.data));
  const refs=[];
  S.carousels.forEach(c=>(c.slides||[]).forEach(s=>{ const k=s.photoId||s.photoData; if(k && !known.has(k)){ known.add(k); refs.push({id:'ref-'+refs.length, assetId:s.photoId||'', data:s.photoData||'', ref:true, category:'', used:(use[k]||none).posted, drafts:(use[k]||none).drafts, src:imgSrc(s.photoId,s.photoData)}); } }));
  return [...lib.sort((a,b)=>(a.order||0)-(b.order||0) || (b.createdAt||'').localeCompare(a.createdAt||'')), ...refs];
}

function fieldsHTML(s,car){
  const L=s.layout, f=(k,label,rows=2,hint='')=>`<div class="field"><label for="f-${k}">${label}</label><textarea id="f-${k}" rows="${rows}" data-field="${k}">${esc((k==='items'||k==='items2')?(s[k]||[]).join('\n'):(s[k]||''))}</textarea>${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  const i=(k,label,hint='')=>`<div class="field"><label for="f-${k}">${label}</label><input type="text" id="f-${k}" data-field="${k}" value="${esc(s[k]||'')}">${hint?`<span class="hint">${hint}</span>`:''}</div>`;
  const b=S.brand, swatch={photo:'linear-gradient(135deg,'+b.soft+','+b.accent+')',sand:b.bg,sage:b.sage||'#DDE7DC',white:b.card,taupe:b.accent,ink:b.ink};
  const parts=[], acc=()=>i('accent','Italic line','Optional. Shows in your accent font.');
  switch(L){
    case 'stat': parts.push(i('number','Big number','Keep it short, like $8,000 or 30 years'), f('heading','Line under the number',2), acc()); break;
    case 'tip': parts.push(i('number','Tip label','Like “Tip 3” or “Step 1 of 5”'), f('heading','Headline',2), acc()); break;
    case 'quote': parts.push(f('heading','Quote',3), i('accent','Who said it','Optional, like “Sarah, first-time buyer”. Only use real quotes, with permission.')); break;
    case 'compare': parts.push(f('heading','Headline',2), i('leftTitle','Left heading','Like “Do this”'), f('items','Left list, one per line',4), i('rightTitle','Right heading','Like “Not this”'), f('items2','Right list, one per line',4)); break;
    case 'mythfact': parts.push(f('heading','Headline',2), f('myth','Myth',2), f('fact','Fact',3)); break;
    default:
      parts.push(f('heading','Headline',2), acc());
      if(['list','steps','checklist'].includes(L)) parts.push(f('items', L==='steps'?'Steps, one per line':L==='checklist'?'Checklist items, one per line':'List items, one per line',5, L==='steps'?'Use steps only when the order matters.':''));
  }
  parts.push(f('body','Body text',3));
